name: evam-assets

services:
  postgres:
    image: postgres:16-alpine
    container_name: evam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evam
      POSTGRES_PASSWORD: evam
      POSTGRES_DB: evam_assets
    ports:
      - "5433:5432"
    volumes:
      - evam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evam -d evam_assets"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: evam-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

volumes:
  evam_pgdata:
