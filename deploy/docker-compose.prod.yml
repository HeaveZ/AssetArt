name: assetnova

# ─────────────────────────────────────────────────────────────────────────────
# AssetNova production stack (mikroservis mimari)
#
#   postgres → DB + named volume
#   redis    → cache + future rate-limit (NextAuth Redis adapter için hazır)
#   migrator → oneshot Prisma migrate deploy (postgres healthy olunca çalışır,
#              başarıyla biter, web ona bağımlı)
#   web      → Next.js standalone (host 8090)
#   caddy    → TLS reverse proxy (opsiyonel, --profile tls ile aktive et)
#
# Çalıştır:
#   cd deploy
#   docker compose --env-file ../.env.production -f docker-compose.prod.yml up -d
#
# Caddy + TLS (DNS hazırsa):
#   docker compose --env-file ../.env.production --profile tls -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: assetnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-evam_assets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-evam} -d ${POSTGRES_DB:-evam_assets}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: assetnova-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    image: ghcr.io/heavez/assetnova-migrator:${IMAGE_TAG:-v2.0}
    container_name: assetnova-migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    image: ghcr.io/heavez/assetnova-web:${IMAGE_TAG:-v2.0}
    container_name: assetnova-web
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [internal]
    ports:
      - "${APP_PORT:-8090}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: assetnova-caddy
    restart: unless-stopped
    profiles: [tls]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-assets.heavezz.uk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
