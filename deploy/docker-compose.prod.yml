name: assetart

services:
  postgres:
    image: postgres:16-alpine
    container_name: assetart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-assetart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [assetart]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetart} -d ${POSTGRES_DB:-assetart}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: assetart:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: assetart-app
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assetart}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [assetart]
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: terminate TLS for you. Enable with `--profile caddy`.
  caddy:
    image: caddy:2-alpine
    container_name: assetart-caddy
    restart: unless-stopped
    profiles: [caddy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [assetart]

networks:
  assetart:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
