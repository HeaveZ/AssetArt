# ─────────────────────────────────────────────────────────────────────────────
# AssetArt · Nginx server block
#
# Place this file at:
#   /etc/nginx/sites-available/assetart.conf
# Then symlink it to enable:
#   ln -sf /etc/nginx/sites-available/assetart.conf /etc/nginx/sites-enabled/assetart.conf
#
# Before reloading nginx, replace `__APP_HOST__` with your real hostname
# (e.g. `assets.assetart.com`) and run the certbot step in `setup.sh`.
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limit zone for auth endpoints (10 req/s with burst handled below)
limit_req_zone $binary_remote_addr zone=assetart_auth:10m rate=10r/s;

# Upstream to the dockerized Next.js app
upstream assetart_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ── HTTP → HTTPS redirect (Certbot also uses /.well-known) ───────────────────
server {
  listen 80;
  listen [::]:80;
  server_name __APP_HOST__;

  # Let's Encrypt http-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name __APP_HOST__;

  # ── TLS (Certbot writes these paths automatically) ─────────────────────────
  ssl_certificate     /etc/letsencrypt/live/__APP_HOST__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__APP_HOST__/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/__APP_HOST__/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  # ── Security headers ───────────────────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # ── Body size: tuned for asset photo uploads (UploadThing tops 8 MB) ───────
  client_max_body_size 16m;
  client_body_buffer_size 256k;

  # ── Compression ────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript application/javascript
    application/x-javascript application/json application/xml application/xml+rss
    image/svg+xml font/woff2;

  # ── Logging ────────────────────────────────────────────────────────────────
  access_log /var/log/nginx/assetart.access.log;
  error_log  /var/log/nginx/assetart.error.log warn;

  # ── Healthcheck (public, no rate limit) ────────────────────────────────────
  location = /healthz {
    proxy_pass http://assetart_app/api/health;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Auth endpoints: stricter rate-limit ────────────────────────────────────
  location ~ ^/api/auth/(callback|signin|csrf) {
    limit_req zone=assetart_auth burst=20 nodelay;
    proxy_pass http://assetart_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
  }

  # ── Static assets (long cache, immutable) ──────────────────────────────────
  location /_next/static/ {
    proxy_pass http://assetart_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── Application: proxy everything else to Next.js ──────────────────────────
  location / {
    proxy_pass http://assetart_app;
    proxy_http_version 1.1;

    # Forwarded headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Keepalive
    proxy_set_header Connection        "";

    # Streaming / SSE / server actions
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    # Timeouts (long enough for Excel/PDF generation)
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    # WebSocket (Next.js dev HMR, also handy for future live features)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# WebSocket upgrade map (place this once at the http {} level — see /etc/nginx/nginx.conf)
# map $http_upgrade $connection_upgrade {
#   default upgrade;
#   ''      close;
# }
