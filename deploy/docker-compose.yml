name: assetart

# Local development stack. Values come from `.env.local` (loaded automatically by
# `docker compose --env-file .env.local up`) or your shell. Plain defaults are
# fine for a single-developer dev DB but you should override them on shared
# machines.

services:
  postgres:
    image: postgres:16-alpine
    container_name: assetart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetart}
      POSTGRES_DB: ${POSTGRES_DB:-assetart}
    ports:
      - "5433:5432"
    volumes:
      - assetart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetart} -d ${POSTGRES_DB:-assetart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: assetart-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

volumes:
  assetart_pgdata:
